name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key from secrets
        env:
          XMB_KEYSTORE_BASE64: ${{ secrets.XMB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$XMB_KEYSTORE_BASE64" ]; then
            echo "::error::Secret XMB_KEYSTORE_BASE64 is missing - see README.txt (SIGNING)"; exit 1
          fi
          # tolerate spaces / line breaks added when pasting the secret
          printf '%s' "$XMB_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > app/xmb-signing.keystore
          echo "Key restored: $(wc -c < app/xmb-signing.keystore) bytes (expected 2562)"
      - name: Build APK
        env:
          XMB_KEYSTORE_PASSWORD: ${{ secrets.XMB_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk xmb-launcher.apk
          rm -f app/xmb-signing.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: xmb-launcher
          path: xmb-launcher.apk
      - name: Publish to the "latest" release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest xmb-launcher.apk --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Install with Downloader on the Fire Stick or with adb install -r." \
            --target "$GITHUB_SHA" --prerelease
